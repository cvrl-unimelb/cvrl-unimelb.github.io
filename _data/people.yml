faculty:
  - name: "Dr Naveed Akhtar"
    title: "Lab Director · ARC DECRA Fellow, Senior Lecturer"
    photo: "naveed-akhtar.jpg"
    bio: >-
      Dr Akhtar is a computer vision and machine learning scientist with research interests in
      deep learning-based visual modelling. He is an ARC DECRA Fellow and has previously served
      at the University of Western Australia and the Australian National University. His work has
      contributed to interpretability of deep learning models, adversarial attacks and defences,
      point cloud analysis, medical image analysis and hyperspectral image analysis.
    interests: ["Adversarial Machine Learning", "Explainable AI", "3D Point Cloud Analysis", "Medical Image Analysis", "Remote Sensing", "Responsible Generative AI"]
    honors: "USERN Laureate in Formal Sciences, Google Research Scholar Program Award, ACM Distinguished Speaker, WA Early Career Scientist of the Year 2021 Finalist"
    service: "Area Chair for CVPR, ECCV and WACV"
    email: "naveed.akhtar1@unimelb.edu.au"
    scholar: "https://scholar.google.com/citations?user=Xqmlj18AAAAJ"
    website: "https://findanexpert.unimelb.edu.au/profile/1050019-naveed-akhtar"

  - name: "Dr Basim Azam"
    title: "Research Fellow"
    photo: "basim-azam.jpg"
    bio: >-
      Dr Azam works on computer vision, machine learning and explainable AI. Previously a Research
      Fellow at Griffith University, he investigated the explainability of AI algorithms. He completed
      his PhD at Griffith University on deep learning-based context-adaptive architectures for image
      parsing, supported by an Australian Research Council Discovery Project scholarship. His research
      covers object detection, image segmentation, remote sensing and medical imaging.
    interests: ["Computer Vision", "Explainable AI", "Responsible Generative AI", "Remote Sensing", "Medical Image Analysis", "Adversarial Learning"]
    honors: ""
    service: ""
    email: "basim.azam@unimelb.edu.au"
    scholar: ""
    website: "https://findanexpert.unimelb.edu.au/profile/1065421-basim-azam"

