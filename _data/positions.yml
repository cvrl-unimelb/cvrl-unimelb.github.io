- title: "PhD positions"
  open: true
  text: |
    We welcome applications from motivated students interested in:

    - Adversarial machine learning and model robustness
    - Explainable and interpretable AI
    - Responsible generative AI
    - Multi-modal foundation models and world models
    - 3D point cloud processing and understanding
    - Medical image analysis

    Applicants should have a strong background in computer science, mathematics or a related field,
    experience with deep learning frameworks (e.g. PyTorch) and good Python skills. Publications in
    top venues are a plus.

    To apply, email your CV, transcripts and a brief research statement to
    [naveed.akhtar1@unimelb.edu.au](mailto:naveed.akhtar1@unimelb.edu.au).

- title: "Postdoctoral positions"
  open: true
