<header class="site-header">
  <div class="container">
    <div class="header-content">
      <a href="{{ '/' | relative_url }}" class="logo-link" aria-label="{{ site.title }} home">
        <img src="{{ '/images/brand/cvrl-mark.png' | relative_url }}" alt="CVRL" class="logo">
        <div class="site-title">
          <span class="title">{{ site.long_title }}</span>
          <span class="subtitle">{{ site.university }}</span>
        </div>
      </a>
      <nav class="main-nav" aria-label="Main">
        <ul>
          {%- for item in site.nav %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {%- endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
